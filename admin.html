<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administration DRBCK TECH.IT.PRO</title>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="login-box">

    <img src="logo.png" alt="Logo DRBCK" class="logo">

    <h1>DRBCK TECH.IT.PRO</h1>

    <p>Espace administrateur sécurisé</p>

    <form id="loginForm">

        <input
            type="password"
            id="password"
            placeholder="Mot de passe administrateur"
            required
        >

        <button type="submit">SE CONNECTER</button>

    </form>

    <p id="message"></p>

</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    document.getElementById("message").textContent =
    "La vérification sécurisée doit être configurée sur le serveur.";

});
</script>

</body>
</html>

name: Validate DRBCK TECH.IT.PRO
on:
  push:
    branches:
      - main
      - feature/admin-dashboard-foundation
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server.js
      - run: node --check script.js
      - run: npm test

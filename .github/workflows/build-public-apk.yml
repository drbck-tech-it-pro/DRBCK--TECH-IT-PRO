name: Build DRBCK Public APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-public/**"
      - ".github/workflows/build-public-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build public APK
        working-directory: android-public
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DRBCK-TECH-PUBLIC-APK
          path: android-public/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
